<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Encodage et viewport pour la réactivité (mobile) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Workspace - Dashboard</title>
    <!-- Police de caractères Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Lier le CSS -->
    <link rel="stylesheet" href="style.css?v=47">

</head>

<body class="dashboard-page">

    <!-- BARRE LATÉRALE (Sidebar) -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header" style="display: flex; justify-content: center; padding: 0px 5px 0px 5px; margin-top: -40px; margin-bottom: -35px;">
            <img src="logo.png" alt="Logo" class="logo-large">
        </div>
        <ul class="nav-links">
            <!-- Liens de navigation du menu -->
            <li id="nav-dashboard" class="active"><a href="#" onclick="showKanban()">📊 Dashboard</a></li>
            <!-- Ce menu sera masqué par défaut et affiché uniquement pour l'admin -->
            <li id="nav-team" style="display: none;"><a href="#" onclick="showTeam()">👥 Équipe</a></li>
            <li id="nav-profile"><a href="#" onclick="showProfile()">👤 Mon Profil</a></li>
        </ul>
        <div class="sidebar-footer">

            <!-- Bouton de déconnexion -->
            <button id="logout-btn" class="btn-logout">Déconnexion</button>
        </div>
    </nav>

    <!-- CONTENU PRINCIPAL -->
    <main class="main-content">
        <!-- Barre supérieure (Header) -->
        <header class="top-bar">
            <div style="display: flex; align-items: center; flex: 1; min-width: 0;">
                <!-- Bouton pour ouvrir le menu sur mobile -->
                <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
                <div class="page-info" style="min-width: 0;">
                    <!-- Titre de la page dynamique -->
                    <h2 id="page-title">Tableau de bord</h2>
                </div>
            </div>
            <div class="top-actions">


                <!-- Informations utilisateur (nom + avatar cliquable) -->
                <div class="user-info" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div class="avatar custom-avatar" onclick="showProfile()" style="cursor: pointer; width: 36px; height: 36px; border-radius: 50%;" title="Profil">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="10" cy="8" r="5"></circle>
                            <path d="M3 21v-2a7 7 0 0 1 10-6.5"></path>
                            <path d="M15 19l6-6 2 2-6 6-3 1z"></path>
                        </svg>
                    </div>
                    <span id="user-name" style="font-size: 11px; margin-top: 4px; color: var(--text-muted); font-weight: 600;">Admin</span>
                </div>
            </div>
        </header>

        <!-- ZONE DYNAMIQUE (Ici s'injecte le contenu des différentes pages) -->
        <div id="content-area">
            <!-- Le contenu changera ici selon la page cliquée (Kanban par défaut) -->
            <div class="kanban-container" id="kanban-view">
                <div id="kanban-board" class="kanban-board">
                    <p>Chargement des tâches...</p>
                </div>
            </div>
        </div>

        <!-- Bouton flottant pour ajouter une tâche -->
        <button class="fab" id="open-modal-btn">+</button>
    </main>



    <!-- MODALE TÂCHE (Formulaire d'ajout/édition) -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Nouvelle Mission</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">

                <div class="form-group">
                    <label>Titre de la tâche</label>
                    <input type="text" id="task-title" placeholder="Ex: Finir le rapport..." required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="task-desc"></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Priorité</label>
                        <select id="task-priority">
                            <option value="low">Normal</option>
                            <option value="medium" selected>Moyen</option>
                            <option value="high">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Assigné à</label>
                        <select id="task-assign"></select>
                    </div>
                </div>

                <div class="modal-footer">
                    <!-- Boutons d'action -->
                    <button type="submit" class="btn-primary-modal">Enregistrer</button>
                    <button type="button" class="btn-delete" id="delete-task-btn"
                        style="display:none;">Supprimer</button>
                    <button type="button" id="close-modal" class="btn-secondary">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODALE INFOS PROFIL -->
    <div id="profile-info-modal" class="modal">
        <div class="modal-content profile-card" style="text-align: center; padding: 25px;">
            <div id="profile-info-content"></div>
        </div>
    </div>

    <!-- MODALE PROFIL (Modification) -->
    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <h2>Modifier mon profil</h2>
            <form id="profile-form">
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" id="edit-profile-name" required>
                </div>
                <div class="form-group">
                    <label>Adresse Email</label>
                    <input type="email" id="edit-profile-email" required>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-primary-modal">Enregistrer les modifications</button>
                    <button type="button" onclick="document.getElementById('profile-modal').style.display='none'"
                        class="btn-secondary">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts modulaires (Simplification) -->
    <script src="js/api.js"></script>
    <script src="js/kanban.js"></script>
    <script src="js/team.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
