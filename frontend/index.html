<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Encodage et viewport pour la réactivité (mobile) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Workspace - Dashboard</title>
    <meta name="description" content="Lumina Pro — tableau de bord Kanban collaboratif. Gérez vos tâches, colonnes et équipe en temps réel.">
    <!-- CSS chargés en parallèle (plus rapide que les @import séquentiels) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/scrollbar.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/kanban.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms_modals.css">
    <link rel="stylesheet" href="css/auth_profile.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="style.css">
    <!-- Scripts chargés en parallèle sans bloquer le rendu -->
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/columns.js" defer></script>
    <script src="js/tasks.js" defer></script>
    <script src="js/kanban.js" defer></script>
    <script src="js/team.js" defer></script>
    <script src="js/profile.js?v=2" defer></script>
</head>

<body class="dashboard-page">
    <!-- Lien d'évitement pour lecteurs d'écran et navigation clavier -->
    <a href="#content-area" class="skip-link">Aller au contenu principal</a>

    <!-- Titre principal du site, caché visuellement mais lu par les lecteurs d'écran (hiérarchie de titres) -->
    <h1 style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;">Lumina Workspace — Tableau de bord</h1>

    <!-- Fond sombre pour fermer la sidebar en mobile -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" aria-hidden="true"></div>

    <!-- BARRE LATÉRALE (Sidebar) -->
    <nav class="sidebar" id="sidebar" aria-label="Menu de navigation principal">
        <!-- Bouton fermer visible uniquement en mobile -->
        <button class="sidebar-close" onclick="toggleSidebar()" aria-label="Fermer le menu">✕</button>
        <div class="sidebar-header" style="display: flex; justify-content: center; padding: 0px 5px 0px 5px; margin-top: -40px; margin-bottom: -35px;">
            <img src="logo.png" alt="Logo Lumina Workspace" class="logo-large">
        </div>
        <ul class="nav-links">
            <li id="nav-dashboard" class="active"><button type="button" onclick="showKanban()" class="nav-btn" aria-current="page" aria-label="Tableau de bord Kanban"><span aria-hidden="true">📊</span> Dashboard</button></li>
            <li id="nav-team" style="display: none;"><button type="button" onclick="showTeam()" class="nav-btn" aria-label="Gérer l'équipe"><span aria-hidden="true">👥</span> Équipe <span id="team-badge" aria-label="demandes en attente" style="display:none; background:#dc2626; color:#fff; font-size:10px; font-weight:800; border-radius:10px; padding:1px 6px; margin-left:4px;"></span></button></li>
            <li id="nav-profile"><button type="button" onclick="showProfile()" class="nav-btn" aria-label="Voir les statistiques"><span aria-hidden="true">📊</span> Statistiques</button></li>
        </ul>
        <div class="sidebar-footer">
            <button id="logout-btn" class="btn-logout" aria-label="Se déconnecter de l'application">Déconnexion</button>
        </div>
    </nav>

    <!-- CONTENU PRINCIPAL -->
    <main class="main-content">
        <!-- Barre supérieure (Header) -->
        <header class="top-bar">
            <div style="display: flex; align-items: center; flex: 1; min-width: 0;">
                <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Ouvrir ou fermer le menu de navigation" aria-expanded="false" aria-controls="sidebar"><span aria-hidden="true">☰</span></button>
                <div class="page-info" style="min-width: 0;">
                    <!-- Titre de la page dynamique -->
                    <h2 id="page-title">Tableau de bord</h2>
                </div>
            </div>
            <div class="top-actions">


                <!-- Informations utilisateur (nom + avatar cliquable) -->
                <div class="user-info" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <button class="avatar custom-avatar" onclick="showProfile()" aria-label="Voir mon profil" style="cursor: pointer; width: 36px; height: 36px; border-radius: 50%; padding: 0;">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <circle cx="10" cy="8" r="5"></circle>
                            <path d="M3 21v-2a7 7 0 0 1 10-6.5"></path>
                            <path d="M15 19l6-6 2 2-6 6-3 1z"></path>
                        </svg>
                    </button>
                    <span id="user-name" style="font-size: 11px; margin-top: 4px; color: var(--text-muted); font-weight: 600;" aria-live="polite">Admin</span>
                </div>
            </div>
        </header>

        <!-- ZONE DYNAMIQUE (Ici s'injecte le contenu des différentes pages) -->
        <div id="content-area" aria-live="polite">
            <!-- Le contenu changera ici selon la page cliquée (Kanban par défaut) -->
            <div class="kanban-container" id="kanban-view">
                <!-- Barre de recherche + statistiques -->
                <div style="display:flex; align-items:center; gap:16px; padding:16px 28px 0;">
                    <div style="position:relative; flex:1; max-width:320px;">
                        <span style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); pointer-events:none;">🔍</span>
                        <input
                            type="search"
                            id="search-input"
                            placeholder="Rechercher une tâche..."
                            oninput="filterTasks()"
                            style="width:100%; padding:8px 12px 8px 32px; border:1px solid var(--border); border-radius:10px; background:var(--card-bg); color:var(--text); font-size:14px; outline:none;"
                            aria-label="Rechercher une tâche"
                        >
                    </div>
                </div>

                <div id="kanban-board" class="kanban-board">
                    <p>Chargement des tâches...</p>
                </div>
            </div>
        </div>

        <!-- Bouton flottant pour ajouter une tâche -->
        <button class="fab" id="open-modal-btn" aria-label="Ajouter une nouvelle tâche" aria-haspopup="dialog"><span aria-hidden="true">+</span></button>
    </main>



    <!-- MODALE TÂCHE (Formulaire d'ajout/édition) -->
    <div id="task-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <h2 id="modal-title">Nouvelle Mission</h2>
            <form id="task-form" aria-label="Formulaire de gestion de tâche">
                <input type="hidden" id="task-id">

                <div class="form-group">
                    <label for="task-title">Titre de la tâche</label>
                    <input type="text" id="task-title" placeholder="Ex: Finir le rapport..." required aria-required="true" aria-describedby="task-title-error">
                    <span id="task-title-error" role="alert" aria-live="assertive" style="display:none;color:#dc2626;font-size:12px;margin-top:4px;">Le titre est obligatoire. Veuillez saisir un titre pour cette tâche.</span>
                </div>

                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc"></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="task-priority">Priorité</label>
                        <select id="task-priority">
                            <option value="low">Normal</option>
                            <option value="medium" selected>Moyen</option>
                            <option value="high">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="task-assign">Assigné à</label>
                        <select id="task-assign"></select>
                    </div>
                </div>


                <div class="form-group">
                    <label for="task-due">Date d'échéance</label>
                    <input type="date" id="task-due">
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn-primary-modal">Enregistrer</button>
                    <button type="button" class="btn-delete" id="delete-task-btn" aria-label="Supprimer cette tâche" style="display:none;">Supprimer</button>
                    <button type="button" id="close-modal" class="btn-secondary" aria-label="Annuler et fermer la fenêtre">Annuler</button>
                </div>
            </form>
        </div>
    </div>



</body>

</html>
