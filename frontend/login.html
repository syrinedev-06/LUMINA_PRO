<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Workspace - Connexion</title>
    <meta name="description" content="Connectez-vous à Lumina Pro, votre espace de gestion de tâches collaboratif basé sur la méthode Kanban.">
    <!-- CSS chargés en parallèle -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/scrollbar.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/kanban.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms_modals.css">
    <link rel="stylesheet" href="css/auth_profile.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="style.css">
    <!-- Scripts sans blocage du rendu -->
    <script src="js/auth.js" defer></script>
</head>

<body class="auth-page">
    <!-- Titre principal du site, caché visuellement mais lu par les lecteurs d'écran (hiérarchie de titres) -->
    <h1 style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;">Lumina Workspace — Connexion</h1>

    <div class="auth-card" style="position: relative;">

        <div style="text-align: center; margin-bottom: -60px; z-index: 1; position: relative;">
            <img src="logo.png" alt="Logo Lumina" class="logo-auth">
        </div>

        <div id="login-section" style="position: relative; z-index: 2;">
            <h2 style="margin-bottom: 10px;">Connexion</h2>
            <form id="login-form" aria-label="Formulaire de connexion">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" autocomplete="username" placeholder="votre@email.com" value="admin@lumina.com" required aria-required="true">
                </div>
                <div class="form-group" style="position: relative;">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••" value="Lumina1!" required aria-required="true" style="padding-right: 35px;">
                    <button type="button" onclick="togglePassword('login-password', this)" aria-label="Afficher ou masquer le mot de passe" style="position: absolute; right: 10px; top: 30px; cursor: pointer; background: none; border: none; font-size: 16px;">
                        <span aria-hidden="true">👁️</span>
                    </button>
                </div>
                <button type="submit" class="btn-primary-modal">Se connecter</button>
            </form>
            <p class="auth-switch">Pas encore de compte ? <button type="button" onclick="toggleAuth()" class="link-btn" aria-label="Aller au formulaire d'inscription">S'inscrire</button></p>
        </div>

        <div id="register-section" style="display: none; position: relative; z-index: 2;" aria-live="polite">
            <h2 style="margin-bottom: 10px;">Inscription</h2>
            <form id="register-form" autocomplete="off" aria-label="Formulaire d'inscription">
                <div class="form-group">
                    <label for="reg-name">Nom complet</label>
                    <input type="text" id="reg-name" name="name" autocomplete="off" placeholder="Prénom Nom" required aria-required="true">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" autocomplete="off" placeholder="votre@email.com" required aria-required="true">
                </div>
                <div class="form-group" style="position: relative;">
                    <label for="reg-password">Mot de passe</label>
                    <input type="password" id="reg-password" name="password" autocomplete="new-password" placeholder="••••••••" required aria-required="true" style="padding-right: 35px;">
                    <button type="button" onclick="togglePassword('reg-password', this)" aria-label="Afficher ou masquer le mot de passe" style="position: absolute; right: 10px; top: 30px; cursor: pointer; background: none; border: none; font-size: 16px;">
                        <span aria-hidden="true">👁️</span>
                    </button>
                </div>
                <button type="submit" class="btn-primary-modal">Créer mon compte</button>
            </form>
            <p class="auth-switch">Déjà inscrit ? <button type="button" onclick="toggleAuth()" class="link-btn" aria-label="Aller au formulaire de connexion">Se connecter</button></p>
        </div>
    </div>

    <script>
        function toggleAuth() {
            const login = document.getElementById('login-section');
            const register = document.getElementById('register-section');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                register.style.display = 'none';
            } else {
                login.style.display = 'none';
                register.style.display = 'block';
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('span');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = '🙈';
                btn.setAttribute('aria-label', 'Masquer le mot de passe');
            } else {
                input.type = 'password';
                icon.innerText = '👁️';
                btn.setAttribute('aria-label', 'Afficher le mot de passe');
            }
        }

</script>
</body>

</html>
