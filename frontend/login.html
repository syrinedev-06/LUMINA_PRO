<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Workspace - Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=46">
</head>

<body class="auth-page">
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="auth-card" style="position: relative;">
        <!-- Bouton Mode Sombre positionné en absolu pour ne rien pousser -->
        <div style="position: absolute; top: 30px; right: 20px; z-index: 10;">
            <label class="theme-switch" title="Changer de thème">
                <input type="checkbox" id="theme-toggle-checkbox" onchange="toggleTheme()">
                <span class="slider">
                    <span class="switch-text light-text">LIGHT</span>
                    <span class="switch-text dark-text">DARK</span>
                    <span class="knob">
                        <span class="icon sun">☀️</span>
                        <span class="icon moon">🌙</span>
                    </span>
                </span>
            </label>
        </div>

        <div style="text-align: center; margin-bottom: -60px; z-index: 1; position: relative;">
            <img src="logo.png" alt="Logo Lumina" class="logo-auth">
        </div>

        <div id="login-section" style="position: relative; z-index: 2;">
            <h2 style="margin-bottom: 10px;">Connexion</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" name="email" autocomplete="username" placeholder="votre@email.com" value="admin@lumina.com" required>
                </div>
                <div class="form-group" style="position: relative;">
                    <label>Mot de passe</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••" value="Lumina1!" required style="padding-right: 35px;">
                    <span onclick="togglePassword('login-password', this)" style="position: absolute; right: 10px; top: 36px; cursor: pointer;" title="Afficher/Masquer">👁️</span>
                </div>
                <button type="submit" class="btn-primary-modal">Se connecter</button>
            </form>
            <p class="auth-switch">Pas encore de compte ? <a href="#" onclick="toggleAuth()">S'inscrire</a></p>
        </div>

        <div id="register-section" style="display: none; position: relative; z-index: 2;">
            <h2 style="margin-bottom: 10px;">Inscription</h2>
            <form id="register-form" autocomplete="off">
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" id="reg-name" name="name" autocomplete="off" placeholder="Prénom Nom" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" name="email" autocomplete="off" placeholder="votre@email.com" required>
                </div>
                <div class="form-group" style="position: relative;">
                    <label>Mot de passe</label>
                    <input type="password" id="reg-password" name="password" autocomplete="new-password" placeholder="••••••••" required style="padding-right: 35px;">
                    <span onclick="togglePassword('reg-password', this)" style="position: absolute; right: 10px; top: 36px; cursor: pointer;" title="Afficher/Masquer">👁️</span>
                </div>
                <button type="submit" class="btn-primary-modal">Créer mon compte</button>
            </form>
            <p class="auth-switch">Déjà inscrit ? <a href="#" onclick="toggleAuth()">Se connecter</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        function toggleAuth() {
            const login = document.getElementById('login-section');
            const register = document.getElementById('register-section');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                register.style.display = 'none';
            } else {
                login.style.display = 'none';
                register.style.display = 'block';
            }
        }

        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.innerText = '🙈';
            } else {
                input.type = 'password';
                iconElement.innerText = '👁️';
            }
        }

        // Basculer le thème
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }

        // Initialiser l'état de la checkbox au chargement
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('darkMode') === 'true') {
                document.getElementById('theme-toggle-checkbox').checked = true;
            }
        });
    </script>
</body>

</html>
